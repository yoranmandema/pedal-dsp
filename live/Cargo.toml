[package]
name = "pedal-live"
version = "0.1.0"
edition = "2021"
description = "Live host: same EffectChain, real-time audio via cpal"

[dependencies]
pedal-dsp = { path = "../dsp" }
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
hound = "3.5"

[profile.release]
opt-level = 2
