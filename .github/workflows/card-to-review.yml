name: Transition card to review when PR opens, to done when merged

on:
  pull_request:
    types:
      - opened
      - reopened
      - closed
    branches:
      - develop

jobs:
  transition-to-review:
    if: github.event.action == 'opened' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract card ID from branch name
        id: card-id
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if echo "$BRANCH" | grep -qE '^(feature|fix)/t_([a-f0-9]{8,})$'; then
            echo "card_id=$(echo "$BRANCH" | sed "s/^.\{0,2\}//" | sed 's/^feature\///;s/^fix\///')" >> "$GITHUB_OUTPUT"
          elif echo "$BRANCH" | grep -qE '^(feature|fix)/'; then
            echo "card_id=$(echo "$BRANCH" | sed "s/^.\{0,2\}//" | sed 's/^feature\///;s/^fix\///')" >> "$GITHUB_OUTPUT"
          fi
          echo "Card ID: ${{ steps.card-id.outputs.card_id }}"

      - name: Transition card to review
        if: steps.card-id.outputs.card_id != ''
        run: |
          CARD_ID="${{ steps.card-id.outputs.card_id }}"
          echo "Transitioning kanban card $CARD_ID to review"
          echo "PR #${{ github.event.pull_request.number }} opened - card $CARD_ID in review. See ${{ github.event.pull_request.html_url }}" >> "$GITHUB_STEP_SUMMARY"

  transition-to-done:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract card ID from branch name
        id: card-id
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if echo "$BRANCH" | grep -qE '^(feature|fix)/t_([a-f0-9]{8,})$'; then
            echo "card_id=$(echo "$BRANCH" | sed "s/^.\{0,2\}//" | sed 's/^feature\///;s/^fix\///')" >> "$GITHUB_OUTPUT"
          elif echo "$BRANCH" | grep -qE '^(feature|fix)/'; then
            echo "card_id=$(echo "$BRANCH" | sed "s/^.\{0,2\}//" | sed 's/^feature\///;s/^fix\///')" >> "$GITHUB_OUTPUT"
          fi
          echo "Card ID: ${{ steps.card-id.outputs.card_id }}"

      - name: Transition card to done
        if: steps.card-id.outputs.card_id != ''
        run: |
          CARD_ID="${{ steps.card-id.outputs.card_id }}"
          echo "Transitioning kanban card $CARD_ID to done"
          echo "PR #${{ github.event.pull_request.number }} merged to develop - card $CARD_ID done. See https://github.com/yoranmandema/pedal-dsp/pull/${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
