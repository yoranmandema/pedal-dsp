name: Auto-merge on CI green

on:
  pull_request:
    branches: [develop]
    types: [ready_for_review, review_request_requested, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to auto-merge'
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  wait-and-merge:
    name: Wait for CI, then merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Determine PR
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for all checks to pass
        uses: lewagon/wait-on-check@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          allowedAbortTimeout: 0
          # Wait for CI jobs: rust and ui
          recheckDuration: 15
          timeout: 1800

      - name: Squash merge PR
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.pr.outputs.pr_number }} --squash --auto
