name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # One target dir for every step (lifecycle tests look the engine binary up here),
      # so the engine isn't rebuilt from scratch and rust-cache covers it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install Rust
        run: rustup install stable
      - uses: Swatinem/rust-cache@v2
      - name: Build engine binary
        run: cargo build -p pedal-engine --bin pedal-engine
      - name: Run tests
        run: cargo test --workspace --exclude pedal-shell --exclude pedal-engine
      - name: Run lifecycle tests
        timeout-minutes: 10
        run: cargo test -p pedal-engine --test lifecycle

  ui:
    name: UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: cd ui && pnpm install --frozen-lockfile
      - name: Build
        run: cd ui && pnpm run build
