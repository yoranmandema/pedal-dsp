[package]
name = "pedal-engine"
version = "0.1.0"
edition = "2021"
description = "Pedal engine: state, audio, and the IPC server"

[lib]
name = "pedal_engine"
path = "src/lib.rs"

[[bin]]
name = "pedal-engine"
path = "src/main.rs"

[dependencies]
pedal-dsp = { path = "../dsp" }
dsp-graph = { path = "../graph" }
rtrb = "0.2"
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
pedal-health = { path = "../health" }
# Model browsing: the local index, listModels/getModel/refreshIndex/
# downloadModel/cancelDownload over IPC.
pedal-tone3000 = { path = "../tone3000" }
# SHA-256 of downloaded model files (download verification, spec §9.2).
sha2 = "0.10"
# HTTP client for downloading model binaries (downloadModel).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
